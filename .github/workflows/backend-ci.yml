name: Backend CI/CD

on:
  push:
    branches:
      - master

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: 750458374913.dkr.ecr.eu-north-1.amazonaws.com/cph-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check Node.js Version
        run: node -v

      - name: Install Dependencies
        run: npm ci

      - name: Build Docker Image
        run: docker build -t cph-backend .

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag Docker Image
        run: |
          docker tag cph-backend:latest $ECR_REPOSITORY:latest

      - name: Push Docker Image
        run: |
          docker push $ECR_REPOSITORY:latest

      - name: Create SSH Key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > github-actions.pem
          chmod 600 github-actions.pem

      - name: Deploy to EC2
        run: |
          ssh -o StrictHostKeyChecking=no \
            -i github-actions.pem \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "bash /home/ubuntu/deploy.sh"

      - name: Cleanup SSH Key
        if: always()
        run: rm -f github-actions.pem