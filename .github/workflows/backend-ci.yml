name: Backend CI

on:
  push:
    branches:
      - master

jobs:
  backend-check:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Check Node.js version
        run: node -v
      - name: Install Dependencies
        run: npm ci
